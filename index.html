<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIagent.com.mx — The Future of Intelligent Automation</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
 :root {
 --black: #050508;
 --white: #F4F1EC;
 --cyan: #00FFD1;
 --electric: #0AFFE0;
 --orange: #FF5C1A;
 --dim: #1A1A2E;
 --mid: #0F3460;
 --grid: rgba(0,255,209,0.06);
 --glass: rgba(255,255,255,0.04);
 --glass-border: rgba(0,255,209,0.18);
 }

 *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

 html { scroll-behavior: smooth; }

 body {
 background: var(--black);
 color: var(--white);
 font-family: 'Space Mono', monospace;
 overflow-x: hidden;
 cursor: crosshair;
 }

 /* ── GRID BACKGROUND ─────────────────────── */
 body::before {
 content:'';
 position:fixed; inset:0; z-index:0;
 background-image:
 linear-gradient(var(--grid) 1px, transparent 1px),
 linear-gradient(90deg, var(--grid) 1px, transparent 1px);
 background-size: 40px 40px;
 pointer-events:none;
 }

 body::after {
 content:'';
 position:fixed; inset:0; z-index:0;
 background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,255,209,0.12) 0%, transparent 70%);
 pointer-events:none;
 }

 /* ── SCAN LINE ──────────────────────────── */
 @keyframes scanline {
 0% { transform: translateY(-100vh); }
 100%{ transform: translateY(100vh); }
 }
 .scanline {
 position:fixed; left:0; top:0; right:0; height:2px; z-index:1000;
 background: linear-gradient(transparent, rgba(0,255,209,0.15), transparent);
 animation: scanline 8s linear infinite;
 pointer-events:none;
 }

 /* ── LAYOUT ─────────────────────────────── */
 .page { position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:0 24px; }

 /* ── HEADER ─────────────────────────────── */
 header {
 position:sticky; top:0; z-index:900;
 background: rgba(5,5,8,0.85);
 backdrop-filter: blur(20px);
 border-bottom: 1px solid var(--glass-border);
 }
 .header-inner {
 max-width:1440px; margin:0 auto; padding:0 24px;
 display:flex; align-items:center; justify-content:space-between;
 height:68px;
 }
 .logo {
 font-family:'Syne', sans-serif; font-weight:800; font-size:1.35rem;
 letter-spacing:-0.03em; text-decoration:none;
 display:flex; align-items:center; gap:10px;
 }
 .logo-bracket { color: var(--cyan); font-size:1.6rem; }
 .logo-text { color: var(--white); }
 .logo-tld { color: var(--cyan); }
 .logo-pulse {
 width:8px; height:8px; border-radius:50%;
 background: var(--cyan);
 box-shadow: 0 0 10px var(--cyan);
 animation: pulse 2s ease-in-out infinite;
 }
 @keyframes pulse {
 0%,100%{ opacity:1; transform:scale(1); }
 50%{ opacity:0.4; transform:scale(0.6); }
 }

 nav { display:flex; gap:32px; align-items:center; }
 nav a {
 color: rgba(244,241,236,0.6); text-decoration:none;
 font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
 transition: color 0.2s;
 }
 nav a:hover { color: var(--cyan); }
 .nav-cta {
 background: var(--cyan); color: var(--black) !important;
 padding:8px 18px; font-weight:700 !important;
 border: none; cursor:pointer; font-family:'Space Mono',monospace;
 font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
 }

 /* ── HERO / BANNER AREA ─────────────────── */
 .hero {
 min-height:88vh; display:grid;
 grid-template-columns: 1fr 340px;
 gap:32px; align-items:center;
 padding: 80px 0 60px;
 }

 .hero-left { position:relative; }
 /* ── LEFT SIDEBAR ───────────────────────── */
 .sidebar-left { display:flex; flex-direction:column; gap:20px; }
 .widget-title {
 font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase;
 color:rgba(0,255,209,0.5); margin-bottom:14px;
 padding-bottom:8px; border-bottom:1px solid rgba(0,255,209,0.1);
 }
 .sidebar-widget { }
 .recent-post {
 padding:14px 0; border-bottom:1px solid rgba(244,241,236,0.06);
 cursor:pointer;
 }
 .recent-post:last-child { border-bottom:none; }
 .recent-post-cat { font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); margin-bottom:4px; }
 .recent-post-title { font-family:'Syne',sans-serif; font-weight:600; font-size:0.8rem; line-height:1.3; }
 .recent-post-title:hover { color:var(--cyan); }
 .recent-post-date { font-size:0.62rem; color:rgba(244,241,236,0.35); margin-top:5px; }

 .tag-cloud { display:flex; flex-wrap:wrap; gap:6px; }
 .tag {
 padding:5px 10px;
 border:1px solid rgba(244,241,236,0.12); font-size:0.62rem;
 letter-spacing:0.08em; text-transform:uppercase;
 color:rgba(244,241,236,0.5); cursor:pointer; transition:all 0.2s;
 }
 .tag:hover { border-color:var(--cyan); color:var(--cyan); }

 /* ── CENTER: MAIN BLOG POST ─────────────── */
 .main-post {}
 .post-cat-banner {
 display:flex; align-items:center; gap:12px; margin-bottom:20px;
 }
 .post-cat {
 font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--cyan);
 }
 .post-cat-line { flex:1; height:1px; background:rgba(0,255,209,0.15); }

 .post-title {
 font-family:'Syne',sans-serif; font-weight:800;
 font-size:clamp(1.8rem, 3.5vw, 3rem); line-height:1.05;
 letter-spacing:-0.03em; margin-bottom:20px;
 }
 .post-title em { font-style:normal; color:var(--cyan); }

 .post-meta {
 display:flex; align-items:center; gap:20px; margin-bottom:28px;
 padding-bottom:20px; border-bottom:1px solid rgba(244,241,236,0.08);
 }
 .post-author { display:flex; align-items:center; gap:8px; }
 .author-avatar {
 width:30px; height:30px; border-radius:50%;
 background:rgba(0,255,209,0.15); border:1px solid rgba(0,255,209,0.3);
 display:flex; align-items:center; justify-content:center; font-size:0.8rem;
 }
 .author-name { font-size:0.7rem; }
 .post-date { font-size:0.68rem; color:rgba(244,241,236,0.4); }
 .post-read { font-size:0.68rem; color:rgba(244,241,236,0.4); }

 .post-featured-img {
 width:100%; aspect-ratio:16/7; margin-bottom:32px;
 background: linear-gradient(135deg, rgba(0,255,209,0.08) 0%, rgba(15,52,96,0.6) 50%, rgba(255,92,26,0.06) 100%);
 border:1px solid var(--glass-border);
 display:flex; align-items:center; justify-content:center;
 font-size:8rem; position:relative; overflow:hidden;
 }
 .post-featured-img::after {
 content:''; position:absolute; inset:0;
 background: linear-gradient(transparent 60%, rgba(5,5,8,0.8));
 }

 .post-body { font-size:0.88rem; line-height:1.95; color:rgba(244,241,236,0.82); }
 .post-body h2 {
 font-family:'Syne',sans-serif; font-weight:700; font-size:1.4rem;
 letter-spacing:-0.02em; margin:36px 0 14px; color:var(--white);
 }
 .post-body h3 {
 font-family:'Syne',sans-serif; font-weight:600; font-size:1.1rem;
 margin:28px 0 10px; color:rgba(244,241,236,0.9);
 }
 .post-body p { margin-bottom:18px; }
 .post-body strong { color:var(--white); }
 .post-body a { color:var(--cyan); text-decoration:none; border-bottom:1px solid rgba(0,255,209,0.3); }
 .post-body a:hover { border-color:var(--cyan); }

 .post-body blockquote {
 border-left:3px solid var(--cyan); margin:28px 0;
 padding:20px 24px;
 background: rgba(0,255,209,0.04);
 font-family:'Instrument Serif',serif; font-style:italic; font-size:1.05rem;
 color:rgba(244,241,236,0.9); line-height:1.7;
 }
</style>
